[program:apache]
command=/usr/sbin/apache2ctl -D FOREGROUND
user=root
autostart=true
autorestart=true
stopsignal=TERM
stopasgroup=true
killasgroup=true
priority=10

[program:queue]
command=php /var/www/html/artisan queue:work database --sleep=3 --tries=3 --timeout=90
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=95
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=20
